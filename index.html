<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tap Game</title>
<style>
  body { font: 20px sans-serif; text-align: center; padding: 40px 15px; }
  button { font-size: 24px; padding: 18px 28px; }
</style>
<h1>Tap Game</h1>
<p>Score: <span id="score">0</span></p>
<button onclick="score++; document.querySelector('#score').textContent = score">
  Tap me!
</button>
<script>let score = 0;</script>
</html>
